version: 2
updates:
  # This repository's own workflows pin every action to a commit SHA with
  # the version in a trailing comment. actionlint catches syntax drift, not
  # staleness, so Dependabot moves both the SHA and the comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"

  # The .lokf/ sidecar's Python toolchain (the `lokf` package). A major bump
  # can require concept frontmatter changes, so these want a human read.
  - package-ecosystem: "uv"
    directory: "/.lokf"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(lokf)"

  # The website's toolchain. Dev dependencies are grouped so a routine week
  # is one pull request.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(website)"
    groups:
      dev-dependencies:
        dependency-type: "development"
