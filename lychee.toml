# A failed request is retried with a wait that grows each time, so a
# host that answers a burst with 503 (github.com, below) has time to
# recover before the link is declared dead. A failed connection is not
# retried here; lint-and-docs.yaml checks the links a second time instead.
max_retries = 3
retry_wait_time = 5

# A copy of this repository in a private organisation adds that
# organisation's addresses to this list, such as
# '^https://github\.com/<org>/' and '^https://raw\.githubusercontent\.com/<org>/'.
# GitHub answers 404 to a link checker for every private page, and the
# workflow's token reads this repository alone. A page that a proxy
# answers with 403 or a sign-in page goes here too, by its host, rather
# than as an accepted status, which would pass a block page as a link.
exclude = [
  # LOKF's published JSON-LD context; upstream's identifier, not this
  # repository's, currently 404s. Drop once the w3id.org redirect is registered.
  '^https://w3id\.org/lokf/context\.jsonld$',
  # A member's namespace that does not yet resolve to its concepts, which
  # LOKF permits: an identifier, not a hyperlink.
  '^https://w3id\.org/lmodel/gist/knowledge/',
  # Development-only addresses.
  '^http://localhost',
  '^http://127\.0\.0\.1',
  # conventionalcommits.org answers CI runners with 503 while serving 200
  # elsewhere; not a dead link.
  '^https://www\.conventionalcommits\.org/',
]

# github.com answers a burst of requests for file pages (`/blob/`) with 503,
# while raw.githubusercontent.com serves the same files. A missing file still
# answers 404 there, so the check stays real.
remap = [
  '^https://github\.com/([^/]+/[^/]+)/blob/([^?#]+)([?#].*)?$ https://raw.githubusercontent.com/$1/$2',
]

exclude_path = [
  # knowledge_bundle is a link to .lokf/knowledge (the doorway, ktl-sidecar
  # Step 2): the same files, which would be walked twice.
  "(^|/)knowledge_bundle/",
  # What the website's build writes; website/'s own link check covers them.
  "(^|/)website/(dist|public|src/content|src/generated|node_modules)/",
  # What a local knowledge-federate.py build writes, gitignored; the
  # federation workflow builds it afresh from the members' releases.
  "^snapshot/",
]

# The rest of github.com answers a burst of requests from one runner with
# 503. Pace the requests to it rather than exclude it, so a moved or
# deleted page still fails.
[hosts."github.com"]
concurrency = 2
request_interval = "250ms"
